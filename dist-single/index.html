:`gift`,at:[5.5,1.8,-4.62],label:`冰箱上的禮盒`,text:`小妤八月從新加坡寄回來的雞精，一盒十二瓶，封膜還在。他在電話裡是這樣說的：有啦，每天都有喝，很好喝。`}]},{day:90,scene:`hall`,time:`dusk`,kicker:`被發現的那一天`,narration:`十二月。小妤從新加坡連打了三天，每一通都響到自己斷掉。她翻出三年前爸爸傳來的租約照片，照著上面的號碼打給房東。現在，房東站在這扇門前。`,after:`九十天。這麼久，怎麼會沒有人知道？再往回走。`,hotspots:[{id:`mailbox`,at:[6.36,1.62,-.98],label:`信箱`,text:`早就塞不下了。郵差每天經過，他的辦法是：把信摺小一點。`,cards:[{kicker:`12/5　銀行`,title:`房租轉帳成功`,lines:[`轉出 9,000 元`,`每月 5 日自動轉帳，無須處理`]},{kicker:`11/20　台電`,title:`電費扣繳成功`,lines:[`本期用電 71 度`,`已自您的帳戶扣款`]},{kicker:`10/20　區公所`,title:`重陽敬老禮金領取通知`,lines:[`請本人攜帶身分證領取`,`逾期未領，視同放棄`]},{kicker:`10/8　郵局`,title:`掛號郵件招領通知`,lines:[`第二次投遞，無人應門`,`逾期將退回原寄局`]},{kicker:`每週四　賣場`,title:`本週特價`,lines:[`十二個禮拜，十二張`,`沒有一張被打開`]}]},{id:`notice`,at:[6.3,1.82,-2.74],label:`門上的單子`,text:`三張。兩張叫他去領掛號，一張叫他去領重陽節的敬老禮金。里幹事按過電鈴，夾了單子就走。沒有人多想一步：一個天天在家的人，怎麼會一直沒來領。`},{id:`light`,at:[6.45,.08,-3],label:`門縫的光`,text:`房東按了三次電鈴，然後拿出備用鑰匙，手有一點抖。門開了，燈還亮著。九十個晚上，對面的人每晚都看見這道光，每晚都安心一次：他在家。`,cut:{open:!0,hold:6400}}]},{day:60,scene:`hall`,time:`night`,kicker:`每個人都有不敲門的理由`,narration:`十一月，兩個月了。樓梯間的燈不太亮，門縫底下那道光，反而成了這裡最暖的東西。`,after:`帳有人付。燈有人看見。電話有人打。只是沒有一隻手，放到這扇門上。`,hotspots:[{id:`meter`,at:[6.36,2.36,-1.02],label:`電表`,text:`還在轉，很慢，像一個人睡著時的呼吸。水電自動扣款，房租每個月五號自己轉出去。房東準時收到錢，沒有理由爬這兩層樓。`},{id:`deodorizer`,at:[7,.34,-.3],label:`陳太太門口的除臭劑`,text:`陳太太覺得樓梯間有一股味道。她想，是誰家的廚餘，還是水溝。她買了一盒除臭劑放在自己門口，檸檬的。跟里長提過一次，里長說，老公寓都這樣。`},{id:`ring`,at:[6.3,1.2,-2.86],label:`門後的鈴聲`,text:`門後面，手機在響。小妤這個月第二次打來，響了四十秒。他重聽，電話常常隔天才回，自己也說過：沒消息就是好消息。她掛了，想著明天再打。`,cut:{shot:`inside`,rings:2,sound:`phone`,hold:4200}}]},{day:30,scene:`room`,time:`day`,kicker:`沒有人覺得奇怪`,narration:`十月。屋裡的時間停了，屋外的沒有。他還在餐桌邊，像只是趴著歇一下。`,hotspots:[{id:`phone`,at:[2.68,1.06,-2.5],label:`手機`,text:`螢幕每隔一陣子亮一次，照亮一小塊桌面，再暗下去。他本來就常常隔好幾天才回一個「好」。所以沒有人覺得奇怪。`,phone:{mode:`list`,time:`14:07`,date:`10 月 15 日 星期四`,items:[{from:`客運老同事`,text:`阿坤：@誠哥 ？`,when:`昨天`},{from:`客運老同事`,text:`阿坤：@誠哥 火鍋來不來`,when:`10/12`},{from:`小妤`,text:`又沒聽到電話喔`,when:`9/29`},{from:`小妤`,text:`爸？`,when:`9/26`},{from:`小妤`,text:`爸，中秋快樂`,when:`9/25`}],more:`還有 82 則通知`}},{id:`plant`,at:[1.25,1.62,-4.8],label:`窗邊的黃金葛`,text:`退休那天同事送的。他每天早上澆水，順便跟它報告今天要去哪裡。沒有水以後，它又撐了三個禮拜。最後一片葉子，是朝著窗戶垂下去的。`},{id:`calendar`,at:[2.93,1.58,-4.94],label:`日曆`,text:`停在 15。他每天醒來第一件事，就是撕掉昨天。現在整間屋子裡，只剩它還守著那一天。`},{id:`clock`,at:[.1,2.42,-3.78],label:`掛鐘`,side:`right`,text:`結婚那年買的。滴答，滴答，鐘擺還在走。整間屋子裡，現在只有它還在動。再過二十幾天，電池也要沒電了。`}]},{day:3,scene:`room`,time:`night`,kicker:`他大概在忙`,narration:`第三天的晚上。燈亮著，麵還在桌上。這三天裡，有三個人想起過他。`,after:`他大概在忙。他大概沒聽到。下次再說。每一句都合情合理。`,hotspots:[{id:`phone`,at:[2.68,1.06,-2.5],label:`未接來電`,side:`left`,text:`阿坤終於想起那句「下次約釣魚」。兩通，都響到沒有人接。他想：誠哥重聽，八成沒聽到。下次吧。`,phone:{mode:`list`,time:`21:20`,date:`9 月 18 日 星期五`,items:[{from:`未接來電`,text:`阿坤（2）`,when:`16:12`},{from:`客運老同事`,text:`阿坤：週末大安溪，有人要跟嗎`,when:`16:15`}]}},{id:`lamp`,at:[3.48,2.12,-2.6],label:`客廳的燈`,text:`從對面看過來，二樓那扇窗是暖的。陳太太倒垃圾的時候抬頭看了一眼。燈亮著，人就在。她本來想問柚子甜不甜，想想，不要打擾人家。`,cut:{shot:`street`,hold:5200}},{id:`door`,at:[5.7,.22,-2.95],label:`門邊的便條`,text:`從門縫底下塞進來的：「周先生，週三共餐等你喔。里長」。它躺在門邊兩天了，離他五步。`},{id:`fan`,at:[.85,1.42,-2.35],label:`電風扇`,text:`那天晚上很悶，他開了電風扇。它還在左右搖頭，把同一陣風，一遍一遍吹過他的背。`}]},{day:1,scene:`hall`,time:`day`,kicker:`有人按了電鈴`,narration:`隔天中午。共餐的桌上多了一副沒人動的碗筷。里長吃完便當，順路走了過來。`,after:`門只有一扇，三公分厚。門裡門外，差了五步，和一句「下次」。`,hotspots:[{id:`bell`,at:[6.3,1.32,-3.84],label:`電鈴`,text:`叮咚——。叮咚——。叮咚——。電鈴在屋子裡響得很清楚，清楚到有點吵。他就在燈底下。`,cut:{shot:`inside`,press:!0,rings:2,hold:3600}},{id:`chief`,at:[7.05,1.12,-3.08],label:`里長`,text:`他按了三次，等了一分鐘，還把耳朵湊近門板聽了一下。阿誠重聽，沒應門不奇怪；他也說過，不習慣人多。里長撕了張便條，從門縫塞進去。下次再問。`},{id:`light`,at:[6.45,.08,-2.8],label:`門縫的光`,text:`大白天，門縫底下有光。里長看見了，心裡閃過一下：怎麼白天開燈。然後他想，燈亮著，就是有人在家。`}]},{day:0,scene:`room`,time:`night`,kicker:`他倒下的那個晚上`,narration:`九月十五，星期二，一個什麼事都沒有的日子。晚上，他覺得胸口有點悶。他想，趴一下就好。`,after:`他沒有再起來。這個晚上，為什麼屋子裡只有他一個人？再往回走。`,hotspots:[{id:`him`,at:[3.98,1.42,-2.5],label:`阿誠`,text:`周文誠，六十八歲，大家叫他阿誠。他把碗往前推，額頭靠在手臂上。燈沒有關，因為他打算等一下起來洗碗。`},{id:`bowl`,at:[3.36,.94,-2.28],label:`桌上的麵`,text:`巷口的陽春麵，吃了一半，還冒著煙。老闆娘問他今天怎麼這麼晚，他說，一個人，幾點吃都一樣。這是他這一天，對人說的唯一一句話。`},{id:`phone`,at:[2.68,1.06,-2.5],label:`手機`,text:`十一點四十分。通訊錄停在「小妤」。他看了很久。`,phone:{mode:`call`,time:`23:40`,name:`小妤`,sub:`新加坡　現在 23:40`,refuse:[`太晚了。`,`她明天還要上班。`,`明天再打。`],locked:`他把手機放回桌上。螢幕暗了。`}},{id:`pill`,at:[2.4,.86,-2.98],label:`藥盒`,side:`left`,text:`高血壓的藥，醫生說一天都不能斷。星期二晚上那一格，還蓋著。旁邊那包是七月的，他一直說，下次回診再一起拿。`,cards:[{kicker:`藥盒`,title:`一天兩次，早晚飯後`,rows:[[`星期日`,`早 ○`,`晚 ○`],[`星期一`,`早 ●`,`晚 ○`],[`星期二`,`早 ●`,`晚 —`]],lines:[`● 吃了　○ 忘了　— 還蓋著`,`上次回診：6 月。之後兩次，都沒有去`]}]}]},{day:-14,scene:`room`,time:`day`,kicker:`下次`,narration:`九月的第一天，下午。他在椅子上打瞌睡。這個下午，有三個人離他只差一步。`,after:`沒有人不關心他。只是每一份關心，都停在了門口。`,hotspots:[{id:`note`,at:[5.7,1.52,-4.33],label:`冰箱上的單子`,text:`里長親自送來的：社區共餐，每週三中午。他拿磁鐵仔細貼在冰箱上，像貼一張獎狀。里長問要不要登記獨居關懷，他擺擺手：我有女兒。共餐嘛，下次，下次一定去。`},{id:`phone`,at:[2.68,1.06,-2.5],label:`手機`,text:`小妤傳來訊息。他打了幾個字，刪掉，又打了幾個字。`,side:`left`,phone:{mode:`chat`,time:`15:02`,title:`小妤`,bubbles:[{text:`爸，新加坡這邊專案要上線，中秋回不去了`},{text:`過年再回台灣喔`}],drafts:[`那妳什麼時候`,`爸有點想`,`好。工作要緊。沒消息就是好消息，不用一直打。`]}},{id:`door`,at:[5.98,1.2,-3.2],label:`門口`,text:`電鈴響了兩聲。陳太太提著兩顆柚子，在門外等了一下。他重聽，又睡得沉。她把袋子掛在門把上，心想，下次再當面拿給他。`,cut:{shot:`porch`,rings:2,hold:4600}},{id:`trash`,at:[5.5,.55,-3.9],label:`門邊的垃圾`,text:`兩袋，綁好了，放在門邊。垃圾車每天晚上七點半來，音樂一響，整條巷子的人都拎著袋子跑出來。那是他一天裡，唯一會跟鄰居點頭的時候。他已經四天沒有追了。`}]},{day:-45,scene:`room`,time:`night`,kicker:`一整天沒有說話`,narration:`退休後的第四十五天。早上他去站裡泡茶，大家在趕班表，他坐了十分鐘就回來了。然後一直到晚上，他都沒有再開口說一個字。`,after:`沒有人把他推開。是他自己，一步一步，退到了門裡面。`,hotspots:[{id:`tv`,at:[4.02,1.3,-4.76],label:`電視`,tv:!0,text:`電視從早開到晚。他沒有在看，他只是需要屋子裡有人講話。政論節目的來賓吵得很兇，他覺得，這樣還挺熱鬧的。`},{id:`phone`,at:[2.68,1.06,-2.5],label:`手機`,side:`left`,text:`他開始學會一件事：在開口問之前，先替對方把拒絕的理由想好。`,phone:{mode:`chat`,time:`20:15`,title:`站長`,bubbles:[{me:!0,text:`站長，明天我過去泡茶？`},{who:`站長`,text:`誠哥歹勢，這禮拜評鑑，大家都在忙`},{who:`站長`,text:`下次啦！`}],drafts:[`沒關係，那我`,`我只是想`,`好，你們忙。`]}},{id:`papers`,at:[.45,.62,-2.55],label:`長椅旁的報紙`,side:`right`,text:`報紙他還是每天買，從頭版看到分類廣告，看完疊好，捨不得丟。疊到三十幾份的時候他才發現：這是現在唯一一樣，每天準時來找他的東西。`},{id:`pill`,at:[2.4,.86,-2.98],label:`藥盒`,side:`left`,text:`上個月該回診的。他站在公車站牌下等了五分鐘，想到要一個人坐在候診區等兩個小時，就走回來了。下次吧。`,cards:[{kicker:`藥盒`,title:`一天兩次，早晚飯後`,rows:[[`星期四`,`早 ●`,`晚 ●`],[`星期五`,`早 ●`,`晚 ○`],[`星期六`,`早 ○`,`晚 ○`]],lines:[`● 吃了　○ 忘了`,`藥袋還剩 3 包。下次回診：7/28`]}]}]},{day:-90,scene:`room`,time:`morning`,kicker:`退休那天`,narration:`六月。開了三十四年的客運，今天是最後一天。最後一班車六點十分發車，八點前他就到家了。他不知道接下來的一整天要做什麼，於是先幫黃金葛澆水。`,after:`沒有爭吵，沒有決裂，沒有誰對不起誰。只是每個人都以為，還有下次。`,hotspots:[{id:`photo`,at:[5.53,2.17,-4.94],label:`牆上的合照`,text:`站裡替他辦了歡送，蛋糕上寫著「一路順風」。阿坤拍他的肩膀：誠哥，下次約釣魚。每個人都說保持聯絡，有空回來泡茶。每一句都是真心的。`},{id:`planner`,at:[4.62,2.14,-4.94],label:`行事曆`,text:`這個月的格子還寫得滿滿的：排班、回診、阿坤兒子的喜酒。翻到下個月，一格一格，白得很乾淨。`},{id:`phone`,at:[2.68,1.06,-2.5],label:`手機`,text:`他在老同事的群組傳了一張清晨的站牌。這是他最後一次，先開口。`,side:`left`,phone:{mode:`chat`,time:`08:12`,title:`客運老同事（23）`,bubbles:[{me:!0,photo:!0,text:`退休第一天。`},{system:`12 個人按了讚`},{who:`阿坤`,text:`誠哥，下次約釣魚！`},{who:`小陳`,text:`保持聯絡啦`},{who:`站長`,text:`有空回來泡茶`}],end:`之後的九十天，他沒有再先開口。`}},{id:`wife`,at:[4.42,.95,-4.72],label:`阿滿的照片`,text:`他把站裡送的紀念錶放在相框旁邊，倒了一杯茶。「阿滿，我退休了。以後天天在家陪妳。」他說得很大聲，像她只是在廚房。`}]}],j_=[{id:`kun`,who:`阿坤`,label:`「下次約釣魚」`,link:`知道不能等`,vignette:`阿坤沒有等下次。隔週的星期四，他的機車就停在樓下，喇叭按得整條巷子都聽見。有一次爬堤防，阿誠喘到蹲在地上，阿坤二話不說把他載去診所。醫生說：下次胸口悶，不要等，馬上叫人。`,broken:`那天晚上，他覺得胸口悶。沒有人跟他說過，這種悶不能等。他想，趴一下就好。`,reached:!1,found:2,hour:7,finder:`星期四早上，阿坤在樓下按了三次喇叭，沒有人下來。他上樓敲門。`},{id:`daughter`,who:`小妤`,label:`「不用特別回來」`,link:`願意開口`,vignette:`小妤沒有回「好」。她打了電話過來：爸，那你每天早上撕完日曆，拍一張給我。他嘴上嫌麻煩，還是每天都拍，拍得越來越歪。後來他有事沒事都傳訊息給她，半夜睡不著也傳。`,broken:`那天晚上，他知道不對勁，拿起了手機。十一點四十分。太晚了，她明天還要上班。他把手機放回桌上。`,reached:!1,found:1,hour:9,finder:`隔天早上，小妤沒有收到日曆的照片。九點，她開始找人。`},{id:`chief`,who:`里長`,label:`「下次一定去」`,link:`找得到人`,vignette:`里長沒有收下那句「下次」。他說：這禮拜三，我來接你。阿誠去了，被分配去顧冬瓜茶，顧得比誰都認真。里長順手幫他填了一張緊急聯絡卡，也把陳太太的電話給了小妤。`,broken:`那天晚上，他打給了小妤。小妤人在新加坡，握著手機，不知道台中這邊還能找誰。等她一通一通問到人，天已經亮了。`,reached:!0,brokenDay:1,found:1,hour:12,finder:`星期三中午，冬瓜茶沒有人顧。里長放下便當，走過去按他的電鈴。`},{id:`neighbor`,who:`陳太太`,label:`掛在門把上的柚子`,link:`進得了門`,vignette:`陳太太多等了一下，又按了一次電鈴。門開了。後來她每天早上澆花，都隔著鐵窗跟他說一聲早。有一天他拿了一把備用鑰匙過來：放妳那裡，我比較放心。`,broken:`那天晚上，小妤找到了里長。里長趕到門口，敲了很久，進不去。等鎖匠把門打開，已經來不及了。`,reached:!0,brokenDay:0,found:1,hour:7,finder:`隔天早上，陳太太說了早，沒有人
